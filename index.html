<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Gematria Calculator</title>


<style>
body{margin:0;overflow:hidden;background:#1e1e1e;display:flex;justify-content:center;align-items:center;height:100vh;direction:rtl;font-family:Arial}
canvas{position:fixed;top:0;left:0;z-index:0}

.calculator{position:relative;z-index:2;background:#2b2b2b;border-radius:20px;padding:30px;width:420px}

/* INTRO — circle, centre dot, then curves growing OUTWARD */
#introScreen{
position:fixed;inset:0;background:white;display:flex;align-items:center;justify-content:center;
z-index:99999;overflow:hidden;opacity:1;transition:opacity .8s ease;
}
#introScreen svg{width:min(100vw,1600px);height:min(100vh,900px);display:block;overflow:visible}
#introKohn{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-family:"Monotype Corsiva","Edwardian Script ITC","Segoe Script",cursive;
font-size:34px;
font-weight:400;
letter-spacing:.3px;
color:#000;
white-space:nowrap;
opacity:0;
animation:kohnAppear 1.4s ease-in-out 4.7s forwards;
}
@keyframes kohnAppear{from{opacity:0}to{opacity:1}}


#introCircle, #introLeftCurve, #introRightCurve{
fill:none;stroke:#000;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;
}

#introCircle{
stroke-dasharray:1;stroke-dashoffset:1;
animation:drawCircle 2.2s ease-in-out forwards;
}

#introLeftCurve, #introRightCurve{
stroke-dasharray:1;stroke-dashoffset:1;
animation:drawCurve 1.8s ease-in-out 2s forwards;
}

#introDot{
fill:#000;opacity:0;
animation:dotAppear .4s ease-in-out 1.8s forwards,
           dotDisappear .8s ease-in-out 3s forwards;
transform-box:fill-box;
transform-origin:center;
}

@keyframes drawCircle{
from{stroke-dashoffset:1}
to{stroke-dashoffset:0}
}

@keyframes drawCurve{
from{stroke-dashoffset:1}
to{stroke-dashoffset:0}
}

@keyframes dotAppear{
from{opacity:0;transform:scale(.25)}
to{opacity:1;transform:scale(1)}
}

@keyframes dotDisappear{
from{opacity:1}
to{opacity:0}
}

.star{position:absolute;top:8px;left:10px;color:white;cursor:pointer}
.star.active{color:gold}
.settingsBtn{position:absolute;top:8px;right:10px;cursor:pointer}

.topnote{text-align:center;font-size:12px;color:#ccc}

.display{background:#000;color:#0f0;padding:20px;border-radius:10px;margin-bottom:10px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between}
#text{font-size:32px;text-align:right;cursor:text}
#result{font-size:30px;text-align:left;margin-top:10px}

.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

button{
height:70px;border:none;border-radius:12px;background:#444;color:white;
font-size:20px;display:flex;align-items:center;justify-content:center;
}

.equal{background:#34c759}
.clear{background:#ff3b30}
.space{background:orange;color:transparent}
.toggle{background:#0a84ff;grid-column:3/span 2}
.return{background:#0a84ff;grid-column:span 3}

.full{grid-column:span 4;display:flex;justify-content:center;align-items:center}
.calculator[data-theme='dark'] button{background:#183b66;color:#ffffff;box-shadow:none}
.calculator[data-theme='dark'] .equal{background:#34c759;color:#000000}
.calculator[data-theme='dark'] .clear{background:#000000;color:#ffffff}
.calculator[data-theme='dark'] .space{background:#183b66;color:transparent}
.calculator[data-theme='dark'] .toggle{background:#183b66;color:#ffffff}
.calculator[data-theme='dark'] .return{background:#183b66;color:#ffffff}
.colorBox{height:40px}
</style>
</head>

<body>

<div id="introScreen">
<svg viewBox="0 0 1600 900" aria-hidden="true">

  <!-- Circle -->
  <circle id="introCircle"
          cx="800" cy="450" r="345"
          pathLength="1"/>

  <!-- Centre dot -->
  <circle id="introDot"
          cx="800" cy="500" r="8"/>

  <!-- Curves start at the dot and grow OUTWARD -->
  <path id="introLeftCurve"
        d="M 800 500
           C 650 250, 300 190, 120 400"
        pathLength="1"/>

  <path id="introRightCurve"
        d="M 800 500
           C 950 250, 1300 190, 1480 400"
        pathLength="1"/>

</svg>
<div id="introKohn">Kohn Enterprises</div>
</div>

<div class="calculator">
<div class="star" onclick="toggleKatan()">★</div>
<div class="settingsBtn" onclick="toggleSettings()">⚙️</div>
<div class="topnote">בס״ד</div>

<div class="display">
<div id="text"></div>
<div id="result">0</div>
</div>

<div class="buttons" id="buttons"></div>
</div>

<script>
/* INTRO — only show the first time */
const introScreen=document.getElementById("introScreen");
const introKohn=document.getElementById("introKohn");

if(localStorage.getItem("gematriaIntroShown")==="yes"){
  // Intro has already been shown — remove it immediately
  if(introScreen) introScreen.remove();
}else{
  // First visit — play the intro normally
  setTimeout(()=>{
    if(!introScreen) return;

    const logo=introScreen.querySelector("svg");
    if(logo){
      logo.style.transition="opacity .9s ease";
      logo.style.opacity="0";
    }

    setTimeout(()=>{
      if(introKohn) introKohn.style.animationPlayState="running";
    },900);

    setTimeout(()=>{
      introScreen.style.opacity="0";

      setTimeout(()=>{
        introScreen.remove();

        // Remember that the intro has now been shown
        localStorage.setItem("gematriaIntroShown","yes");
      },800);

    },3200);
  },3800);
}
/* DOM */
const textEl=document.getElementById('text');
const resultEl=document.getElementById('result');
const buttonsEl=document.getElementById('buttons');

/* KEYBOARD */
document.addEventListener("keydown",e=>{
if(document.getElementById("introScreen")) return;

if(e.key==="Backspace"){currentText=currentText.slice(0,-1);updateDisplay();return;}
if(e.key===" "){add(" ");return;}
if(e.key==="Enter"){pressEquals();return;}
if(/[\u0590-\u05FF]/.test(e.key)){add(e.key);}
});

/* PASTE */
document.addEventListener("paste",e=>{
if(document.getElementById("introScreen")) return;

let paste=(e.clipboardData||window.clipboardData).getData("text");
paste=paste.replace(/[^\u0590-\u05FF\s]/g,"");
currentText+=paste;
updateDisplay();
});

/* LOGIC */
function changeDensity(v){density=v;createParticles()}
function changeBg(c){document.body.style.background=c}

const gematria={'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'כ':20,'ך':20,'ל':30,'מ':40,'ם':40,'נ':50,'ן':50,'ס':60,'ע':70,'פ':80,'ף':80,'צ':90,'ץ':90,'ק':100,'ר':200,'ש':300,'ת':400};

let currentText='',useKatan=false,showFinal=false,settingsMode=false;
let lastCalculation={text:'',value:0};

function calculateValue(t){
let s=0;
for(let c of t){
if(gematria[c]){
let v=gematria[c];
if(useKatan){v=v%9||9}
s+=v;
}}
return s;
}

function updateDisplay(){
textEl.innerText=currentText||' ';
resultEl.innerText=calculateValue(currentText);
}

function add(l){currentText+=l;updateDisplay()}
function clearAll(){currentText='';updateDisplay()}

function toggleKatan(){
useKatan=!useKatan;
document.querySelector('.star').classList.toggle('active');
updateDisplay();
}

function toggleKeyboard(){showFinal=!showFinal;renderButtons()}
function toggleSettings(){settingsMode=!settingsMode;renderButtons()}

function setTheme(mode){
  const dark=mode==='dark';
  document.body.style.background=dark?'#000000':'#ffffff';
  document.body.style.color=dark?'#ffffff':'#000000';
  const calc=document.querySelector('.calculator');
  calc.style.background=dark?'#2b2b2b':'#000000';
  calc.style.color=dark?'#ffffff':'#000000';
  calc.dataset.theme=mode;
  renderButtons();
}


function pressEquals(){
lastCalculation.text=currentText;
lastCalculation.value=calculateValue(currentText);
updateDisplay();
}

function loadLast(){
if(lastCalculation.text){currentText=lastCalculation.text;updateDisplay();}
}

/* BUTTONS */
const normal=['א','ב','ג','ד','ה','ו','ז','ח','ט','י','כ','ל','מ','נ','ס','ע','פ','צ','ק','ר','ש','ת'];
const finalK=['ך','ם','ן','ף','ץ'];

function renderButtons(){
buttonsEl.innerHTML='';

if(settingsMode){
let light=document.createElement('button');
light.innerText='Light Mode';
light.style.background='#ffffff';
light.style.color='#000000';
light.onclick=()=>setTheme('light');
buttonsEl.appendChild(light);

let dark=document.createElement('button');
dark.innerText='Dark Mode';
dark.style.background='#183b66';
dark.style.color='#ffffff';
dark.onclick=()=>setTheme('dark');
buttonsEl.appendChild(dark);

let back=document.createElement('button');
back.className='return';
back.innerText='חזור';
back.onclick=toggleSettings;
buttonsEl.appendChild(back);
return;
}

if(showFinal){
finalK.forEach(k=>{
let b=document.createElement('button');
b.innerText=k;
b.onclick=()=>add(k);
buttonsEl.appendChild(b);
});

let r=document.createElement('button');
r.className='return';
r.innerText='חזור';
r.onclick=toggleKeyboard;
buttonsEl.appendChild(r);
return;
}

normal.forEach(k=>{
let b=document.createElement('button');
b.innerText=k;
b.onclick=()=>add(k);
buttonsEl.appendChild(b);
});

let t=document.createElement('button');
t.className='toggle';
t.innerText='סופיות';
t.onclick=toggleKeyboard;
buttonsEl.appendChild(t);

let eq=document.createElement('button');
eq.className='equal';
eq.innerText='=';
eq.onclick=pressEquals;
buttonsEl.appendChild(eq);

let sp=document.createElement('button');
sp.className='space';
sp.onclick=()=>add(' ');
buttonsEl.appendChild(sp);

let clr=document.createElement('button');
clr.className='clear';
clr.innerText='C';
clr.onclick=clearAll;
buttonsEl.appendChild(clr);

let title=document.createElement('button');
title.style.background='white';
title.style.color='black';
title.style.fontFamily="'Cormorant Garamond', cursive";
title.innerText='Gematria Calculator';
title.onclick=loadLast;
buttonsEl.appendChild(title);
}

renderButtons();
</script>

</body>
</html>
